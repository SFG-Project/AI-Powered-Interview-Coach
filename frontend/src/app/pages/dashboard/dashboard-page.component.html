<main class="dashboard-page">
  <app-sidebar [activeItem]="'dashboard'"></app-sidebar>

  <section class="dashboard-content">
    <h1>Dashboard</h1>

    <section class="summary-grid" aria-label="Dashboard summary cards">
      <article class="summary-card" *ngFor="let card of summaryCards">
        <p class="summary-label">{{ card.label }}</p>
        <p class="summary-value">{{ card.value }}</p>
      </article>
    </section>

    <section class="welcome-card">
      <h2>Welcome Back</h2>
      <p>
        You are improving. Keep practicing to increase confidence and
        communication.
      </p>

      <div class="welcome-actions">
        <button
          type="button"
          class="btn btn-primary"
          routerLink="/interview-session"
        >
          Start Interview
        </button>
        <button type="button" class="btn btn-success" routerLink="/progress">
          View Progress
        </button>
        <button type="button" class="btn btn-danger">View Reports</button>
      </div>
    </section>

    <section class="table-card">
      <h2>Recent Interviews</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Role</th>
              <th>Type</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of recentInterviews">
              <td>{{ row.date }}</td>
              <td>{{ row.role }}</td>
              <td>{{ row.type }}</td>
              <td>{{ row.score }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </section>
</main>
